[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (incl. Content-Security-Policy) are emitted into dist/_headers
# at build time by the `csp-headers` Vite plugin (see vite.config.ts). The CSP
# script-src hashes are computed from the built index.html, so they never drift
# from the inline anti-FOUC theme script. Edit headers there, not here.
